<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexx Studio — Video Editor</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f6f7fb;font:14px system-ui,Arial}.app{height:100vh;display:grid;grid-template-columns:235px 1fr 265px;grid-template-rows:62px 1fr 190px}.top{grid-column:1/4;background:#11141c;border-bottom:1px solid #282d3a;display:flex;align-items:center;padding:0 18px;gap:12px}.logo{font-size:20px;font-weight:800}.logo i{color:#7c5cff;font-style:normal}.sp{flex:1}.btn,.tab{border:1px solid #363c4b;background:#181c25;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:#7c5cff;border-color:#7c5cff}.side{background:#10131a;padding:15px;border-right:1px solid #282d3a;overflow:auto}.right{border-right:0;border-left:1px solid #282d3a}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:14px}.tab{font-size:11px;padding:8px}.tab.on{background:#242035;border-color:#7c5cff}.drop{border:1px dashed #4a5162;padding:15px;border-radius:10px;text-align:center;color:#9ba3b5;margin-bottom:12px}.drop input{width:100%;margin-top:8px}.media{display:grid;gap:7px}.item{padding:8px;background:#171b24;border:1px solid #292e3b;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer}.item:hover{border-color:#7c5cff}.thumb{width:48px;height:34px;object-fit:cover;border-radius:5px;background:#080a0f}.main{display:flex;align-items:center;justify-content:center;padding:25px;background:radial-gradient(circle,#191c28,#080a0f 68%)}.preview{width:min(850px,100%);aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden;position:relative;box-shadow:0 25px 80px #000b}.preview video,.preview img{width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#697286}.caption{position:absolute;left:10%;right:10%;bottom:35px;text-align:center;font-size:34px;font-weight:800;text-shadow:0 3px 12px #000}.heading{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8992a5;margin:4px 0 10px}.row{display:flex;align-items:center;gap:8px;margin:10px 0}.row label{width:78px;color:#aeb5c4;font-size:12px}.row input[type=range]{flex:1}.select,.text{width:100%;padding:9px;background:#171b24;border:1px solid #363c4b;color:#fff;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{padding:9px;border:1px solid #292e3b;background:#171b24;color:#fff;border-radius:8px;cursor:pointer}.timeline{grid-column:1/4;background:#0d1017;border-top:1px solid #282d3a;padding:10px 14px}.transport{display:flex;gap:7px;align-items:center;margin-bottom:9px}.clock{color:#9ba3b5;min-width:100px}.seek{flex:1}.tracks{height:105px;border:1px solid #282d3a;border-radius:8px;overflow:auto;background:#090c11}.ruler{height:23px;color:#687286;font-size:10px;border-bottom:1px solid #242936;padding:5px 10px;white-space:nowrap}.track{display:flex;gap:6px;padding:8px;min-width:max-content}.clip{height:48px;min-width:145px;padding:5px 8px;background:#202532;border:1px solid #41495a;border-radius:7px;display:flex;align-items:center;gap:8px}.clip.active{border-color:#7c5cff}.clip img{width:45px;height:34px;object-fit:cover;border-radius:4px}.badge{font-size:10px;background:#1c2030;color:#b6b0ff;padding:4px 7px;border-radius:6px}@media(max-width:850px){.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:62px auto auto 190px}.top,.timeline{grid-column:1}.side{border:0;border-bottom:1px solid #282d3a}}
</style></head><body><div class="app"><header class="top"><div class="logo">Rexx <i>Studio</i></div><span class="badge">MEDIA EDITOR</span><div class="sp"></div><button class="btn" id="clear">New Project</button><button class="btn primary" id="export">Export</button></header>
<aside class="side"><div class="tabs"><button class="tab on">Media</button><button class="tab">Audio</button><button class="tab">Elements</button></div><div class="drop">📁 Add photos, videos & audio<input id="mediaFiles" type="file" accept="image/*,video/*,audio/*" multiple></div><div id="media" class="media"></div><div class="heading" style="margin-top:18px">Quick actions</div><div class="grid"><button class="tool" id="dup">Duplicate</button><button class="tool" id="del">Delete</button><button class="tool" id="left">← Move</button><button class="tool" id="right">Move →</button></div></aside>
<main class="main"><div class="preview"><video id="vid" playsinline></video><img id="photo" hidden><div id="empty" class="empty">Upload a photo or video to begin</div><div id="caption" class="caption"></div></div></main>
<aside class="side right"><div class="heading">Adjustments</div><div class="row"><label>Brightness</label><input id="b" type="range" min="50" max="150" value="100"><span id="bv">100</span></div><div class="row"><label>Contrast</label><input id="c" type="range" min="50" max="150" value="100"><span id="cv">100</span></div><div class="row"><label>Saturation</label><input id="s" type="range" min="0" max="200" value="100"><span id="sv">100</span></div><div class="heading" style="margin-top:18px">Filter</div><select id="filter" class="select"><option value="none">Original</option><option value="grayscale(1)">B&W</option><option value="sepia(.7)">Vintage</option><option value="contrast(1.2) saturate(1.3)">Punchy</option></select><div class="heading" style="margin-top:18px">Text</div><input id="text" class="text" placeholder="Add a title..."><div class="heading" style="margin-top:18px">Canvas</div><select id="ratio" class="select"><option value="16/9">YouTube 16:9</option><option value="9/16">Reels / Shorts 9:16</option><option value="1/1">Instagram 1:1</option></select><div class="heading" style="margin-top:18px">Transitions</div><select class="select" id="transition"><option>None</option><option>Fade</option><option>Slide</option><option>Zoom</option></select></aside>
<section class="timeline"><div class="transport"><button class="btn" id="back">−5s</button><button class="btn primary" id="play">▶</button><button class="btn" id="next">+5s</button><span class="clock" id="clock">00:00 / 00:00</span><input class="seek" id="seek" type="range" min="0" max="0" step=".01"></div><div class="tracks"><div class="ruler">00:00　　00:05　　00:10　　00:15　　00:20　　00:25　　00:30</div><div id="track" class="track"></div></div></section></div>
<script>
const $=id=>document.getElementById(id),vid=$('vid'),photo=$('photo');let items=[],active=-1;
const fmt=s=>String(Math.floor((s||0)/60)).padStart(2,'0')+':'+String(Math.floor((s||0)%60)).padStart(2,'0');
function css(){return`brightness(${$('b').value}%) contrast(${$('c').value}%) saturate(${$('s').value}%) ${$('filter').value==='none'?'':$('filter').value}`}
function render(){let m=$('media'),t=$('track');m.innerHTML='';t.innerHTML='';items.forEach((x,i)=>{let a=document.createElement('div');a.className='item';a.innerHTML=`<span>${x.type==='image'?'🖼️':x.type==='audio'?'🎵':'🎬'}</span><span style="overflow:hidden;text-overflow:ellipsis">${x.name}</span>`;a.onclick=()=>select(i);m.appendChild(a);let c=document.createElement('div');c.className='clip '+(i===active?'active':'');c.innerHTML=`<span>${x.type==='image'?'🖼️':x.type==='audio'?'🎵':'🎬'}</span><span>${x.name.slice(0,18)}</span>`;c.onclick=()=>select(i);t.appendChild(c)})}
function select(i){active=i;let x=items[i];if(x.type==='image'){vid.pause();vid.hidden=true;photo.hidden=false;photo.src=x.url}else if(x.type==='video'){photo.hidden=true;vid.hidden=false;vid.src=x.url;vid.load()}else{vid.hidden=true;photo.hidden=false;photo.removeAttribute('src');photo.style.background='#171b24';photo.style.display='block';photo.alt='Audio track'}$('empty').style.display='none';render();update()}
$('mediaFiles').onchange=e=>{[...e.target.files].forEach(f=>{let type=f.type.startsWith('image')?'image':f.type.startsWith('audio')?'audio':'video';items.push({name:f.name,type,url:URL.createObjectURL(f),file:f,duration:0});let x=items[items.length-1];if(type==='video'){let q=document.createElement('video');q.preload='metadata';q.src=x.url;q.onloadedmetadata=()=>{x.duration=q.duration;render()}}});if(active<0&&items.length)select(0);render()};
vid.onloadedmetadata=()=>{$('seek').max=vid.duration||0;update()};vid.ontimeupdate=update;function update(){let d=active>=0?items[active].duration:(vid.duration||0);$('clock').textContent=fmt(vid.currentTime)+' / '+fmt(d);$('seek').value=vid.currentTime||0}
$('play').onclick=()=>{if(active<0)return;let x=items[active];if(x.type==='video'){vid.paused?vid.play():vid.pause()}else alert('Photos and audio are placed on the timeline; select a video to preview playback.')};$('back').onclick=()=>vid.currentTime=Math.max(0,vid.currentTime-5);$('next').onclick=()=>vid.currentTime=Math.min(vid.duration||0,vid.currentTime+5);$('seek').oninput=()=>vid.currentTime=+$('seek').value;
['b','c','s'].forEach((id,i)=>$(id).oninput=()=>{$(''+['bv','cv','sv'][i]).textContent=$(id).value;vid.style.filter=photo.style.filter=css()});$('filter').onchange=()=>vid.style.filter=photo.style.filter=css();$('text').oninput=()=>$('caption').textContent=$('text').value;$('ratio').onchange=()=>document.querySelector('.preview').style.aspectRatio=$('ratio').value;
$('del').onclick=()=>{if(active<0)return;URL.revokeObjectURL(items[active].url);items.splice(active,1);active=Math.min(active,items.length-1);if(active>=0)select(active);else{$('empty').style.display='grid';vid.removeAttribute('src');photo.removeAttribute('src')}render()};$('dup').onclick=()=>{if(active<0)return;items.splice(active+1,0,{...items[active],name:items[active].name+' copy'});active++;render()};$('left').onclick=()=>{if(active>0){[items[active-1],items[active]]=[items[active],items[active-1]];active--;render()}};$('right').onclick=()=>{if(active>=0&&active<items.length-1){[items[active+1],items[active]]=[items[active],items[active+1]];active++;render()}};$('clear').onclick=()=>{items.forEach(x=>URL.revokeObjectURL(x.url));items=[];active=-1;vid.removeAttribute('src');photo.removeAttribute('src');$('empty').style.display='grid';render()};
$('export').onclick=()=>alert('Project ready. Browser export for video clips is available in the PRO editor; photo/audio tracks are loaded locally in this studio.');render();
</script></body></html>
