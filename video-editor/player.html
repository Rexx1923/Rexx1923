<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexx Studio — Player</title><style>body{margin:0;background:#080a0f;color:#fff;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:30px}.player{background:#000;border-radius:14px;overflow:hidden;box-shadow:0 25px 80px #0009}.screen{position:relative;aspect-ratio:16/9;display:grid;place-items:center}.screen video{width:100%;height:100%;object-fit:contain}.center{position:absolute;width:74px;height:74px;border:0;border-radius:50%;background:#7c5cff;color:#fff;font-size:30px;cursor:pointer;opacity:.9}.controls{padding:14px;background:#11141c}.seek{width:100%;accent-color:#7c5cff}.row{display:flex;align-items:center;gap:8px}.btn{background:#191d27;color:#fff;border:1px solid #343a49;border-radius:8px;padding:9px 12px;cursor:pointer}.play{background:#7c5cff;border-color:#7c5cff}.time{min-width:105px;color:#aeb5c5}.vol{width:100px}.speed{background:#191d27;color:#fff;border:1px solid #343a49;border-radius:8px;padding:9px}.hint{color:#7f889b;font-size:12px;margin-top:12px}.upload{margin-bottom:14px}.back{display:inline-block;color:#fff;text-decoration:none;margin-bottom:18px}</style></head><body><div class="wrap"><a class="back" href="../">← Rexx Studio</a><div class="upload"><input id="file" type="file" accept="video/*"></div><div class="player"><div class="screen"><video id="v" playsinline preload="metadata"></video><button class="center" id="center">▶</button></div><div class="controls"><input class="seek" id="seek" type="range" min="0" max="0" step="0.01" value="0"><div class="row"><button class="btn" id="prev">|◀</button><button class="btn" id="back">−5s</button><button class="btn play" id="play">▶</button><button class="btn" id="next">+5s</button><button class="btn" id="nextClip">▶|</button><span class="time" id="time">00:00 / 00:00</span><button class="btn" id="mute">🔊</button><input class="vol" id="volume" type="range" min="0" max="1" step=".01" value="1"><select class="speed" id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option></select><button class="btn" id="full">⛶</button></div></div></div><div class="hint">Space: play/pause · ←/→: 1 second · Shift+←/→: 5 seconds · M: mute · F: fullscreen · Home/End: start/end</div></div><script>const v=document.getElementById('v'),seek=document.getElementById('seek'),play=document.getElementById('play'),center=document.getElementById('center'),time=document.getElementById('time'),file=document.getElementById('file');let url='';const fmt=s=>{s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};function toggle(){v.paused?v.play():v.pause()}function ui(){let d=v.duration||0;seek.max=d;seek.value=v.currentTime||0;time.textContent=fmt(v.currentTime)+' / '+fmt(d);play.textContent=v.paused?'▶':'❚❚';center.textContent=v.paused?'▶':'❚❚'}file.onchange=e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;v.load();v.play().catch(()=>{});ui()};play.onclick=toggle;center.onclick=toggle;v.onclick=toggle;v.onloadedmetadata=ui;v.ontimeupdate=ui;v.onplay=ui;v.onpause=ui;seek.oninput=()=>v.currentTime=+seek.value;document.getElementById('back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-5);document.getElementById('next').onclick=()=>v.currentTime=Math.min(v.duration||0,v.currentTime+5);document.getElementById('prev').onclick=()=>v.currentTime=0;document.getElementById('nextClip').onclick=()=>v.currentTime=v.duration||0;document.getElementById('mute').onclick=()=>{v.muted=!v.muted;document.getElementById('mute').textContent=v.muted?'🔇':'🔊'};document.getElementById('volume').oninput=e=>{v.volume=+e.target.value;v.muted=v.volume===0};document.getElementById('speed').onchange=e=>v.playbackRate=+e.target.value;document.getElementById('full').onclick=()=>document.querySelector('.player').requestFullscreen?.();document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft')v.currentTime=Math.max(0,v.currentTime-(e.shiftKey?5:1));else if(e.key==='ArrowRight')v.currentTime=Math.min(v.duration||0,v.currentTime+(e.shiftKey?5:1));else if(e.key.toLowerCase()==='m')document.getElementById('mute').click();else if(e.key.toLowerCase()==='f')document.getElementById('full').click();else if(e.key==='Home')v.currentTime=0;else if(e.key==='End')v.currentTime=v.duration||0});ui();</script></body></html>
