<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexx Ride 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:white;font:14px system-ui}#hud{position:fixed;z-index:5;inset:14px 16px auto;display:flex;gap:8px}.pill,button{background:#090d16dd;border:1px solid #394255;color:white;border-radius:10px;padding:10px 14px}.sp{flex:1}#help{position:fixed;z-index:5;bottom:16px;left:16px;background:#090d16cc;padding:10px;border-radius:10px;color:#c5cada}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#070910}.box{text-align:center}.box h1{font-size:52px;margin:0}.box span{color:#8d72ff}.box p{color:#9aa5b8}</style></head><body><div id="loading"><div class="box"><h1>REXX <span>RIDE</span></h1><p>Loading 3D street...</p></div></div><div id="hud"><div class="pill">🏍️ REXX RIDE 3D</div><div class="pill">SPEED <b id="speed">0</b></div><div class="pill">SCORE <b id="score">0</b></div><div class="sp"></div><button id="nitro">⚡ NITRO</button></div><div id="help">A/D or ←/→ steer • W/↑ wheelie • Space nitro • S/↓ brake • P pause</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x09111d);scene.fog=new THREE.Fog(0x09111d,35,180);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);camera.position.set(0,4.4,9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xaac8ff,0x203018,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-20,30,10);scene.add(sun);const roadMat=new THREE.MeshStandardMaterial({color:0x25282d,roughness:.95});const grassMat=new THREE.MeshStandardMaterial({color:0x233a25});const road=new THREE.Mesh(new THREE.PlaneGeometry(28,500),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-180;scene.add(road);const grass=new THREE.Mesh(new THREE.PlaneGeometry(180,500),grassMat);grass.rotation.x=-Math.PI/2;grass.position.y=-.03;grass.position.z=-180;scene.add(grass);const lineMat=new THREE.MeshBasicMaterial({color:0xffffff});for(let x of [-3.5,0,3.5])for(let z=-10;z>-260;z-=14){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.02,6),lineMat);m.position.set(x,.02,z);scene.add(m)}const bike=new THREE.Group();const red=new THREE.MeshStandardMaterial({color:0xb91c35,metalness:.6,roughness:.25});const black=new THREE.MeshStandardMaterial({color:0x111318,metalness:.7,roughness:.2});const body=new THREE.Mesh(new THREE.BoxGeometry(.75,.5,1.8),red);body.position.y=.8;bike.add(body);const tank=new THREE.Mesh(new THREE.SphereGeometry(.5,16,10),red);tank.scale.set(.8,.55,1.1);tank.position.set(0,1.08,.05);bike.add(tank);for(let z of [-.65,.65]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.18,16),black);w.rotation.z=Math.PI/2;w.position.set(0,.42,z);bike.add(w)}const rider=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),black);rider.position.set(0,1.55,-.15);bike.add(rider);scene.add(bike);bike.position.set(0,0,5);const traffic=[];function car(z){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:[0x2864c7,0xd8b22a,0xeeeeee,0x222222][Math.floor(Math.random()*4)]});const b=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,2.5),m);b.position.y=.55;g.add(b);g.position.set([-4,0,4][Math.floor(Math.random()*3)],0,z);scene.add(g);traffic.push(g)}for(let i=0;i<9;i++)car(-25-i*28);const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')nitro=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let nitro=false,x=0,velocity=25,score=0,paused=false,wheelie=false,last=performance.now();document.getElementById('nitro').onpointerdown=()=>nitro=true;addEventListener('keyup',e=>{if(e.key.toLowerCase()==='p')paused=!paused;if(e.key.toLowerCase()==='w'||e.key==='ArrowUp')wheelie=false});function animate(t){requestAnimationFrame(animate);let dt=Math.min(.035,(t-last)/1000);last=t;if(!paused){let boost=nitro||keys[' '];velocity=Math.min(75,velocity+(boost?45:8)*dt);if(!boost)velocity=Math.max(22,velocity-2*dt);if(keys['a']||keys['arrowleft'])x-=9*dt;if(keys['d']||keys['arrowright'])x+=9*dt;x=Math.max(-7,Math.min(7,x));wheelie=keys['w']||keys['arrowup'];bike.position.x+=(x-bike.position.x)*.15;bike.rotation.z+=(wheelie?-.18:0-bike.rotation.z)*.12;traffic.forEach((c,i)=>{c.position.z+=velocity*dt;if(c.position.z>18)c.position.z=-260-Math.random()*100;if(Math.abs(c.position.x-bike.position.x)<1.15&&Math.abs(c.position.z-bike.position.z)<1.7){velocity=Math.max(15,velocity*.45)}});score+=velocity*dt;document.getElementById('speed').textContent=Math.round(velocity*3.6);document.getElementById('score').textContent=Math.floor(score);nitro=false}renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').remove();animate(performance.now());</script></body></html>
