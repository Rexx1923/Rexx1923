<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexx Ride 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b;font:14px system-ui;color:#fff}canvas{display:block}.hud{position:fixed;z-index:3;top:14px;left:14px;right:14px;display:flex;gap:8px}.pill,button{background:#0a0d15dd;color:#fff;border:1px solid #394153;border-radius:10px;padding:9px 12px;font-weight:700}.sp{flex:1}.menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#05070bcc}.panel{text-align:center;background:#0c1019ee;border:1px solid #343c4d;border-radius:20px;padding:32px;max-width:650px;width:88%}h1{font-size:56px;margin:0}h1 span{color:#8a6cff}.play{background:#795bff;border-color:#795bff;padding:13px 25px}.controls{position:fixed;z-index:4;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between}.row{display:flex;gap:8px}@media(max-width:600px){h1{font-size:40px}.hide{display:none}}</style></head><body><div class="hud"><div class="pill">🏍️ REXX RIDE 3D</div><div class="pill">SCORE <b id="score">0</b></div><div class="pill hide">SPEED <b id="speed">0</b></div><div class="pill">🪙 ∞</div><div class="sp"></div><button id="pause">Ⅱ</button></div><div class="controls"><div class="row"><button id="l">◀</button><button id="r">▶</button></div><div class="row"><button id="w">🏍️ WHEELIE</button><button id="n">⚡ NITRO</button><button id="b">BRAKE</button></div></div><div id="menu" class="menu"><div class="panel"><div style="color:#9b8cff;letter-spacing:.2em">REXX STUDIOS</div><h1>REXX <span>RIDE</span></h1><p>3D ENDLESS SUPERBIKE STREET</p><p>🏙️ Endless road • 🚗 Traffic • 🏍️ Stunts • ⚡ Nitro • 🪙 Unlimited coins</p><button class="play" id="start">START RIDE</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const S=THREE;let scene,camera,renderer,bike,road=[],cars=[],running=false,paused=false,x=0,speed=0,score=0,nitro=0,wheelie=false,last=0;const $=i=>document.getElementById(i);function init(){scene=new S.Scene();scene.background=new S.Color(0x09101c);scene.fog=new S.Fog(0x09101c,35,170);camera=new S.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);camera.position.set(0,4.5,9);renderer=new S.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new S.HemisphereLight(0xaec8ff,0x182018,2));let sun=new S.DirectionalLight(0xffffff,2);sun.position.set(8,15,5);scene.add(sun);makeWorld();bike=makeBike();scene.add(bike);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.render(scene,camera)}function mat(c){return new S.MeshStandardMaterial({color:c,roughness:.65,metalness:.25})}function makeWorld(){let ground=new S.Mesh(new S.PlaneGeometry(500,500),mat(0x1c2920));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);for(let i=0;i<30;i++){let roadm=new S.Mesh(new S.BoxGeometry(12,.12,30),mat(0x26282d));roadm.position.set(0,0,-i*30);scene.add(roadm);road.push(roadm);for(let side of [-1,1]){let h=2+Math.random()*8;let b=new S.Mesh(new S.BoxGeometry(4,h,5),mat(0x17202b+Math.floor(Math.random()*8)));b.position.set(side*(10+Math.random()*7),h/2,-i*30-Math.random()*15);scene.add(b)}}}function makeBike(){let g=new S.Group();let body=new S.Mesh(new S.BoxGeometry(1,.45,2.5),mat(0xb71c2c));body.position.y=.75;g.add(body);let seat=new S.Mesh(new S.BoxGeometry(.7,.25,1),mat(0x111111));seat.position.set(0,1.05,.25);g.add(seat);for(let z of [-.85,.85]){let w=new S.Mesh(new S.CylinderGeometry(.32,.32,.18,20),mat(0x090909));w.rotation.z=Math.PI/2;w.position.set(0,.38,z);g.add(w)}g.position.y=.3;return g}function spawn(){let g=new S.Group();let body=new S.Mesh(new S.BoxGeometry(1.4,1,2.3),mat([0x2274a5,0xe0a400,0x777777,0x9b2226][Math.floor(Math.random()*4)]));g.add(body);g.position.set([-3.5,0,3.5][Math.floor(Math.random()*3)],.65,-130);scene.add(g);cars.push(g)}function start(){score=0;speed=20;nitro=0;running=true;paused=false;$('menu').style.display='none';last=performance.now();requestAnimationFrame(loop)}function loop(t){if(!running)return;requestAnimationFrame(loop);if(paused){renderer.render(scene,camera);return}let dt=Math.min(.035,(t-last)/1000||0);last=t;let boost=nitro>0;nitro=Math.max(0,nitro-(boost?55:0)*dt);speed=Math.min(150,speed+(boost?60:16)*dt);if(!boost)speed=Math.max(25,speed-4*dt);score+=speed*dt*.15;$('score').textContent=Math.floor(score);$('speed').textContent=Math.floor(speed);road.forEach((r,i)=>{r.position.z+=speed*dt;if(r.position.z>15)r.position.z-=900});cars.forEach(c=>{c.position.z+=speed*dt*.7});cars=cars.filter(c=>{if(c.position.z>15){scene.remove(c);return false}return true});if(Math.random()<dt*(.8+speed/100))spawn();bike.position.x+=(x-bike.position.x)*.15;bike.rotation.z+=(wheelie?-.22:0-bike.rotation.z)*.1;camera.position.x+=(bike.position.x*.35-camera.position.x)*.08;camera.lookAt(bike.position.x,1,-18);renderer.render(scene,camera)}function move(d){if(running&&!paused)x=Math.max(-3.5,Math.min(3.5,x+d))}$('l').onpointerdown=()=>move(-.7);$('r').onpointerdown=()=>move(.7);$('w').onpointerdown=()=>wheelie=!wheelie;$('n').onpointerdown=()=>{if(running)nitro=100};$('b').onpointerdown=()=>speed=Math.max(20,speed-30);$('start').onclick=start;$('pause').onclick=()=>paused=!paused;onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-.7);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(.7);if(e.key.toLowerCase()==='w')wheelie=true;if(e.key===' ')nitro=100;if(e.key.toLowerCase()==='s')speed=Math.max(20,speed-30);if(e.key.toLowerCase()==='p')paused=!paused};onkeyup=e=>{if(e.key.toLowerCase()==='w')wheelie=false};init();</script></body></html>
