<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexx Ride — Superbike Runner</title><style>*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font:14px system-ui,Arial;overflow:hidden}.game{width:min(1100px,100vw);height:min(720px,100vh);margin:auto;position:relative;overflow:hidden;background:#11151d}.road{position:absolute;inset:0;background:linear-gradient(#152236 0 34%,#293528 34% 100%)}.road:before{content:'';position:absolute;left:18%;right:18%;inset-block:0;background:#25272b;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}.lane{position:absolute;top:0;bottom:0;width:7px;background:repeating-linear-gradient(#eee 0 55px,transparent 55px 105px);opacity:.7}.l1{left:39%}.l2{left:61%}.hud{position:absolute;top:15px;left:18px;right:18px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap}.pill{background:#090c14dd;border:1px solid #3a4150;padding:8px 11px;border-radius:10px}.sp{flex:1}.bike{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);font-size:74px;filter:drop-shadow(0 10px 9px #000);z-index:3;transition:.08s}.traffic{position:absolute;font-size:52px;top:-80px;z-index:2}.controls{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:6;pointer-events:none}.cluster{display:flex;gap:8px;pointer-events:auto}.btn{border:1px solid #454b5b;background:#10141ddd;color:#fff;border-radius:11px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:#7c5cff;border-color:#7c5cff}.menu{position:absolute;inset:0;background:#070910f5;z-index:10;display:grid;place-items:center;overflow:auto}.panel{width:min(850px,92%);text-align:center;padding:35px 0}.logo{letter-spacing:.2em;color:#a99cff;font-weight:800}.panel h1{font-size:58px;margin:5px 0}.panel h1 span{color:#8b6cff}.panel p{color:#9ca5b7}.garage{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.bikecard{padding:16px;background:#121722;border:1px solid #303747;border-radius:14px;cursor:pointer}.bikecard.active{border-color:#8b6cff;box-shadow:0 0 0 1px #8b6cff44}.machine{font-size:45px;margin-bottom:8px}.small{font-size:11px;color:#9da6b8}.coins{display:inline-block;margin:10px 0;padding:9px 14px;border-radius:99px;background:#171b27;border:1px solid #343b4c;color:#ffd76b;font-weight:800}.hidden{display:none!important}@media(max-width:650px){.panel h1{font-size:40px}.garage{grid-template-columns:1fr 1fr}.bike{font-size:58px}.controls{bottom:8px}.btn{padding:10px}}
</style></head><body><div class="game"><div class="road"><div class="lane l1"></div><div class="lane l2"></div><div id="traffic"></div></div><div class="hud"><div class="pill">🏍️ REXX RIDE</div><div class="pill">BIKE <b id="bikeName">BMW S 1000 RR</b></div><div class="pill">🪙 <b id="coins">∞</b></div><div class="pill">SCORE <b id="score">0</b></div><div class="pill">SPEED <b id="speed">0</b></div><div class="sp"></div><div class="pill">🏆 <b id="best">0</b></div></div><div id="bike" class="bike">🏍️</div><div class="controls"><div class="cluster"><button class="btn" id="left">◀ LEFT</button><button class="btn" id="right">RIGHT ▶</button></div><div class="cluster"><button class="btn" id="brake">BRAKE</button><button class="btn primary" id="nitro">⚡ NITRO</button></div></div><div id="menu" class="menu"><div class="panel"><div class="logo">REXX STUDIOS PRESENTS</div><h1>REXX <span>RIDE</span></h1><p>Choose your superbike, hit the highway and chase your high score.</p><div class="coins">🪙 UNLIMITED COINS</div><h3>🏁 SUPERBIKE GARAGE</h3><div id="garage" class="garage"></div><button class="btn primary" id="start">START RIDE</button><p>Keyboard: A/D or ←/→ to steer • Space = Nitro</p></div></div></div><script>
const $=x=>document.getElementById(x);const bikes=[{name:'BMW S 1000 RR',emoji:'🏍️',color:'Race Bike'},{name:'Ducati Panigale V4',emoji:'🏍️',color:'Italian Superbike'},{name:'Kawasaki Ninja H2',emoji:'🏍️',color:'Hyperbike'},{name:'Yamaha YZF-R1',emoji:'🏍️',color:'Japanese Superbike'},{name:'Honda CBR1000RR-R',emoji:'🏍️',color:'Fireblade'},{name:'Suzuki GSX-R1000R',emoji:'🏍️',color:'Gixxer'},{name:'Aprilia RSV4',emoji:'🏍️',color:'V4 Superbike'},{name:'MV Agusta F4',emoji:'🏍️',color:'Italian Legend'}];let selected=0,running=false,x=50,score=0,spd=0,nitro=0,best=+localStorage.rexxRideBest||0,spawn=0,last=0,objs=[];$('best').textContent=best;function garage(){bikes.forEach((b,i)=>{let d=document.createElement('div');d.className='bikecard '+(i===0?'active':'');d.innerHTML=`<div class="machine">${b.emoji}</div><b>${b.name}</b><div class="small">${b.color}</div><div class="small">UNLOCKED • 🪙 ∞</div>`;d.onclick=()=>{selected=i;document.querySelectorAll('.bikecard').forEach(z=>z.classList.remove('active'));d.classList.add('active');$('bikeName').textContent=b.name};$('garage').appendChild(d)})}garage();
function steer(d){if(!running)return;x=Math.max(27,Math.min(73,x+d));$('bike').style.left=x+'%'}$('left').onpointerdown=()=>steer(-4);$('right').onpointerdown=()=>steer(4);window.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer(-4);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer(4);if(e.code==='Space')boost()};$('brake').onpointerdown=()=>spd=Math.max(0,spd-12);$('nitro').onpointerdown=boost;function boost(){if(running)nitro=100}
function spawnCar(){let el=document.createElement('div');el.className='traffic';el.textContent=['🚗','🚙','🚕','🛻'][Math.floor(Math.random()*4)];let lane=[35,50,65][Math.floor(Math.random()*3)];el.style.left=lane+'%';el.style.top='-80px';$('traffic').appendChild(el);objs.push({el,y:-80,x:lane})}function end(){running=false;$('menu').classList.remove('hidden');$('start').textContent='RIDE AGAIN';$('menu').querySelector('p').innerHTML='Crash! Score: <b>'+Math.floor(score)+'</b><br>Choose another bike or ride again.';best=Math.max(best,Math.floor(score));localStorage.rexxRideBest=best;$('best').textContent=best}
function loop(t){if(!running)return;let dt=Math.min(.03,(t-last)/1000||0);last=t;let boostOn=nitro>0;nitro=Math.max(0,nitro-(boostOn?35:0)*dt);spd=Math.min(100,spd+(boostOn?30:10)*dt);if(!boostOn)spd=Math.max(25,spd-3*dt);score+=spd*dt*.12;$('score').textContent=Math.floor(score);$('speed').textContent=Math.floor(spd);spawn-=dt;if(spawn<=0){spawnCar();spawn=Math.max(.35,1.1-spd/150)}objs.forEach(o=>{o.y+=spd*dt*5;o.el.style.top=o.y+'px';if(o.y>550){o.el.remove();o.dead=true}});objs=objs.filter(o=>!o.dead);for(let o of objs){if(o.y>430&&o.y<530&&Math.abs(o.x-x)<8){end();return}}requestAnimationFrame(loop)}$('start').onclick=()=>{objs.forEach(o=>o.el.remove());objs=[];score=0;spd=20;nitro=0;running=true;$('menu').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)};
</script></body></html>
