<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REXX RIDE — Superbike Highway</title><style>*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font:14px system-ui,Arial;overflow:hidden}.app{min-height:100vh;display:grid;place-items:center}.game{width:min(1100px,100vw);height:min(760px,100vh);position:relative;overflow:hidden;background:#121722}.road{position:absolute;inset:0;background:linear-gradient(#101a2b 0 36%,#263725 36% 100%)}.road:before{content:'';position:absolute;left:17%;right:17%;inset-block:0;background:#25272b;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}.road:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:7px;background:repeating-linear-gradient(#eee 0 65px,transparent 65px 125px);transform:translateX(-50%);opacity:.8}.hud{position:absolute;z-index:8;left:16px;right:16px;top:14px;display:flex;gap:8px;align-items:center}.pill,.btn{background:#090c14dd;border:1px solid #3a4151;color:#fff;border-radius:10px;padding:9px 12px}.sp{flex:1}.bike{position:absolute;z-index:6;bottom:90px;left:50%;transform:translateX(-50%);font-size:74px;filter:drop-shadow(0 15px 10px #000);transition:.1s}.traffic{position:absolute;z-index:5;font-size:55px;top:-90px}.controls{position:absolute;z-index:9;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between}.cluster{display:flex;gap:8px}.btn{cursor:pointer;font-weight:700}.primary{background:#7b5cff;border-color:#7b5cff}.menu{position:absolute;inset:0;z-index:20;background:#070910f2;display:grid;place-items:center;overflow:auto}.panel{width:min(850px,92%);text-align:center;padding:25px}.panel h1{font-size:60px;margin:3px}.panel h1 span{color:#8b6cff}.tabs{display:flex;justify-content:center;gap:7px;margin:20px 0}.tab.active{background:#7b5cff;border-color:#7b5cff}.view{display:none}.view.active{display:block}.garage{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.bikecard{padding:14px;border:1px solid #2e3544;border-radius:12px;background:#111620;cursor:pointer}.bikecard.active{border-color:#8b6cff;box-shadow:0 0 20px #7b5cff33}.machine{font-size:45px;margin:4px}.coins{color:#ffd75a;font-weight:800}.hidden{display:none!important}.toast{position:absolute;z-index:30;bottom:85px;left:50%;transform:translateX(-50%);background:#111722;border:1px solid #3b4352;border-radius:10px;padding:10px 16px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:700px){.garage{grid-template-columns:repeat(2,1fr)}.panel h1{font-size:42px}.hud .hideMob{display:none}.bike{font-size:60px}.controls{bottom:10px}.btn{padding:10px}}
</style></head><body><div class="app"><div class="game"><div class="road"><div id="traffic"></div></div><div class="hud"><div class="pill"><b>🏍️ REXX RIDE</b></div><div class="pill">🪙 <b id="coins">∞</b></div><div class="pill">SCORE <b id="score">0</b></div><div class="pill hideMob">SPEED <b id="speed">0</b></div><div class="sp"></div><button class="btn" id="pause">Ⅱ</button></div><div id="bike" class="bike">🏍️</div><div class="controls"><div class="cluster"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="cluster"><button class="btn" id="brake">BRAKE</button><button class="btn primary" id="nitro">⚡ NITRO</button></div></div><div id="toast" class="toast"></div><div id="menu" class="menu"><div class="panel"><div style="color:#9c8cff;letter-spacing:.2em;font-weight:800">REXX STUDIOS</div><h1>REXX <span>RIDE</span></h1><p id="subtitle">SUPERBIKE HIGHWAY</p><div class="tabs"><button class="btn tab active" data-view="ride">🏁 Ride</button><button class="btn tab" data-view="garage">🏍️ Garage</button><button class="btn tab" data-view="settings">⚙️ Settings</button></div><div id="ride" class="view active"><p>Dodge traffic, build speed and chase your high score.</p><button class="btn primary" id="start">START RIDE</button><p class="coins">🪙 Unlimited Coins ∞</p></div><div id="garage" class="view"><div class="garage" id="garageList"></div><button class="btn primary" id="start2">RIDE SELECTED BIKE</button></div><div id="settings" class="view"><p>Controls: A/D or ←/→ steer • Space = Nitro • P = Pause</p><p>Game is designed for keyboard and mobile touch controls.</p></div></div></div></div></div><script>
const $=id=>document.getElementById(id);const bikes=[['BMW S 1000 RR','🇩🇪','🏍️'],['Ducati Panigale V4','🇮🇹','🏍️'],['Kawasaki Ninja H2','🇯🇵','🏍️'],['Yamaha YZF-R1','🇯🇵','🏍️'],['Honda CBR1000RR-R','🇯🇵','🏍️'],['Suzuki GSX-R1000R','🇯🇵','🏍️'],['Aprilia RSV4','🇮🇹','🏍️'],['MV Agusta F4','🇮🇹','🏍️'],['BMW M 1000 RR','🇩🇪','🏍️'],['Ducati Streetfighter V4','🇮🇹','🏍️'],['KTM RC 8C','🇦🇹','🏍️'],['Yamaha R1M','🇯🇵','🏍️']];let selected=0,running=false,paused=false,x=50,score=0,spd=0,nitro=0,last=0,spawn=0,objs=[];
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}function renderGarage(){let g=$('garageList');g.innerHTML=bikes.map((b,i)=>`<div class="bikecard ${i===selected?'active':''}" data-i="${i}"><div class="machine">${b[2]}</div><b>${b[0]}</b><div>${b[1]} • 🪙 ∞</div></div>`).join('');g.querySelectorAll('.bikecard').forEach(c=>c.onclick=()=>{selected=+c.dataset.i;renderGarage();$('bike').textContent=bikes[selected][2];showToast(bikes[selected][0]+' selected')})}renderGarage();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(a=>a.classList.remove('active'));document.querySelectorAll('.view').forEach(a=>a.classList.remove('active'));t.classList.add('active');$(t.dataset.view).classList.add('active')});
function steer(d){if(!running||paused)return;x=Math.max(28,Math.min(72,x+d));$('bike').style.left=x+'%'}$('left').onpointerdown=()=>steer(-5);$('right').onpointerdown=()=>steer(5);window.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer(-5);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer(5);if(e.code==='Space')boost();if(e.key.toLowerCase()==='p')togglePause()};$('brake').onpointerdown=()=>{spd=Math.max(15,spd-18)};$('nitro').onpointerdown=boost;
function boost(){if(running&&!paused){nitro=100;showToast('⚡ NITRO BOOST')}}function spawnCar(){let el=document.createElement('div');el.className='traffic';el.textContent=['🚗','🚙','🚕','🛻','🚐'][Math.floor(Math.random()*5)];let lane=[34,50,66][Math.floor(Math.random()*3)];el.style.left=lane+'%';el.style.top='-90px';$('traffic').appendChild(el);objs.push({el,y:-90,x:lane})}function crash(){running=false;$('menu').classList.remove('hidden');$('start').textContent='RIDE AGAIN';$('subtitle').textContent='💥 CRASH — SCORE '+Math.floor(score);}
function loop(t){if(!running)return;if(paused){last=t;requestAnimationFrame(loop);return}let dt=Math.min(.035,(t-last)/1000||0);last=t;let b=nitro>0;nitro=Math.max(0,nitro-(b?45:0)*dt);spd=Math.min(145,spd+(b?48:12)*dt);if(!b)spd=Math.max(35,spd-4*dt);score+=spd*dt*.15;$('score').textContent=Math.floor(score);$('speed').textContent=Math.floor(spd);spawn-=dt;if(spawn<=0){spawnCar();spawn=Math.max(.3,.95-spd/180)}objs.forEach(o=>{o.y+=spd*dt*5;o.el.style.top=o.y+'px';if(o.y>760){o.el.remove();o.dead=true}});objs=objs.filter(o=>!o.dead);for(let o of objs)if(o.y>500&&o.y<640&&Math.abs(o.x-x)<8){crash();return}requestAnimationFrame(loop)}
function start(){objs.forEach(o=>o.el.remove());objs=[];score=0;spd=35;nitro=0;x=50;$('bike').style.left='50%';running=true;paused=false;$('menu').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function togglePause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';showToast(paused?'PAUSED':'RESUMED')}$('start').onclick=start;$('start2').onclick=start;$('pause').onclick=togglePause;
</script></body></html>
