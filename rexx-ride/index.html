<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexx Ride — Bike Runner</title><style>*{box-sizing:border-box}body{margin:0;background:#06070b;color:#fff;font:14px system-ui,Arial;overflow:hidden}.app{min-height:100vh;display:grid;place-items:center}.game{width:min(1000px,100vw);height:min(720px,100vh);position:relative;background:#10141b;overflow:hidden}.road{position:absolute;inset:0;background:linear-gradient(#172233 0 35%,#263326 35% 100%)}.road:before{content:'';position:absolute;left:20%;right:20%;top:0;bottom:0;background:#25272b;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}.lane{position:absolute;top:0;bottom:0;width:8px;background:repeating-linear-gradient(#fff 0 55px,transparent 55px 105px);opacity:.75}.l1{left:39%}.l2{left:61%}.hud{position:absolute;inset:18px 20px auto;display:flex;gap:10px;align-items:center;z-index:4}.pill{background:#0b0e15dd;border:1px solid #394052;padding:8px 12px;border-radius:10px}.sp{flex:1}.screen{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}.bike{font-size:76px;filter:drop-shadow(0 10px 8px #000);position:absolute;bottom:80px;left:50%;transform:translateX(-50%);transition:.08s}.traffic{position:absolute;font-size:54px;top:-80px;z-index:2}.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.cluster{display:flex;gap:10px;pointer-events:auto}.btn{border:1px solid #454b5b;background:#11151ddd;color:#fff;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#7c5cff;border-color:#7c5cff}.menu{position:absolute;inset:0;background:#080a0feF;z-index:10;display:grid;place-items:center}.panel{text-align:center;width:min(560px,90%)}h1{font-size:58px;margin:0 0 8px}h1 span{color:#8b6cff}.panel p{color:#9ca5b7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.card{padding:16px;background:#121722;border:1px solid #2d3444;border-radius:12px}.hidden{display:none!important}@media(max-width:600px){h1{font-size:42px}.cards{grid-template-columns:1fr}.bike{font-size:60px}}
</style></head><body><div class="app"><div class="game"><div class="road"><div class="lane l1"></div><div class="lane l2"></div><div id="traffic"></div></div><div class="hud"><div class="pill">🏍️ REXX RIDE</div><div class="pill">SCORE <b id="score">0</b></div><div class="pill">SPEED <b id="speed">0</b></div><div class="sp"></div><div class="pill">🏆 <b id="best">0</b></div></div><div class="screen"><div id="bike" class="bike">🏍️</div></div><div class="controls"><div class="cluster"><button class="btn" id="left">◀ LEFT</button><button class="btn" id="right">RIGHT ▶</button></div><div class="cluster"><button class="btn" id="brake">BRAKE</button><button class="btn primary" id="nitro">⚡ NITRO</button></div></div><div id="menu" class="menu"><div class="panel"><div style="letter-spacing:.2em;color:#9b8cff;font-weight:800">REXX STUDIOS</div><h1>REXX <span>RIDE</span></h1><p>Endless highway bike runner. Dodge traffic, build speed and chase your high score.</p><div class="cards"><div class="card">🏍️<br><b>Ride</b></div><div class="card">⚡<br><b>Nitro</b></div><div class="card">🏆<br><b>High Score</b></div></div><button class="btn primary" id="start">START RIDE</button><p>Keyboard: A/D or ←/→ to steer • Space for nitro</p></div></div></div></div><script>
const $=x=>document.getElementById(x);let running=false,x=50,score=0,spd=0,nitro=0,best=+localStorage.rexxRideBest||0,spawn=0,last=0,objs=[];$('best').textContent=best;
function steer(d){if(!running)return;x=Math.max(27,Math.min(73,x+d));$('bike').style.left=x+'%'}$('left').onpointerdown=()=>steer(-4);$('right').onpointerdown=()=>steer(4);window.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer(-4);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer(4);if(e.code==='Space')boost()};$('brake').onpointerdown=()=>spd=Math.max(0,spd-12);$('nitro').onpointerdown=boost;
function boost(){if(running)nitro=100}function spawnCar(){let el=document.createElement('div');el.className='traffic';el.textContent=['🚗','🚙','🚕','🛻'][Math.floor(Math.random()*4)];let lane=[35,50,65][Math.floor(Math.random()*3)];el.style.left=lane+'%';el.style.top='-80px';$('traffic').appendChild(el);objs.push({el,y:-80,x:lane})}
function end(){running=false;$('menu').classList.remove('hidden');$('start').textContent='RIDE AGAIN';$('menu').querySelector('p').innerHTML='Crash! Score: <b>'+Math.floor(score)+'</b><br>Beat your best and ride again.';best=Math.max(best,Math.floor(score));localStorage.rexxRideBest=best;$('best').textContent=best}
function loop(t){if(!running)return;let dt=Math.min(.03,(t-last)/1000||0);last=t;let boost=nitro>0;nitro=Math.max(0,nitro-(boost?35:0)*dt);spd=Math.min(100,spd+(boost?30:10)*dt);if(!boost)spd=Math.max(25,spd-3*dt);score+=spd*dt*.12;$('score').textContent=Math.floor(score);$('speed').textContent=Math.floor(spd);spawn-=dt;if(spawn<=0){spawnCar();spawn=Math.max(.35,1.1-spd/150)}objs.forEach(o=>{o.y+=spd*dt*5;o.el.style.top=o.y+'px';if(o.y>550){o.el.remove();o.dead=true}});objs=objs.filter(o=>!o.dead);for(let o of objs){if(o.y>430&&o.y<530&&Math.abs(o.x-x)<8){end();return}}requestAnimationFrame(loop)}
$('start').onclick=()=>{objs.forEach(o=>o.el.remove());objs=[];score=0;spd=20;nitro=0;running=true;$('menu').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)};
</script></body></html>
